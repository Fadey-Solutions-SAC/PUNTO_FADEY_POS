services:
  - type: web
    name: punto-fadey
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/punto-fadey.db
      - key: AUTH_SECRET
        sync: false
    disk:
      name: punto-fadey-data
      mountPath: /var/data
      sizeGB: 1
