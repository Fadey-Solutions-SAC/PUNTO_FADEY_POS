# Producción: Express + Vite (SPA). Next queda en el repo para desarrollo/fallback.
services:
  - type: web
    name: punto-fadey
    runtime: node
    plan: starter
    # Solo dependencias de producción en la raíz (sin Next/ESLint); el cliente Vite instala las suyas.
    buildCommand: npm install --omit=dev --no-audit --no-fund && node scripts/build-render.mjs
    startCommand: npm run start:server
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "20.19.0"
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/Lima
      - key: DB_PATH
        value: /var/data/punto-fadey.db
      - key: DATABASE_URL
        value: file:/var/data/punto-fadey.db
      - key: AUTH_SECRET
        sync: false
      - key: PERU_CONSULTAS_TOKEN
        sync: false
    disk:
      name: punto-fadey-data
      mountPath: /var/data
      sizeGB: 10
